<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Clip Gradient -->
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7c2d12" flood-opacity="0.35"/>
    </filter>

    <filter id="sparkleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Main Rounded Gradient Box -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bgGrad)" filter="url(#cardShadow)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="9" y="9" width="110" height="110" rx="29" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>

  <!-- 2. Clipboard Board Body -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="32" width="68" height="74" rx="12" fill="#ffffff" fill-opacity="0.97"/>
    <rect x="30" y="32" width="68" height="74" rx="12" fill="none" stroke="#fed7aa" stroke-width="1.5"/>
  </g>

  <!-- 3. Clipboard Top Metal Clamp -->
  <rect x="46" y="24" width="36" height="18" rx="6" fill="#ffffff"/>
  <rect x="49" y="27" width="30" height="12" rx="4" fill="url(#clipGrad)"/>
  <rect x="57" y="22" width="14" height="6" rx="3" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>

  <!-- 4. Checklist Lines -->
  <!-- Item 1 -->
  <circle cx="43" cy="54" r="4" fill="#f97316"/>
  <path d="M41 54 L42.5 55.5 L45.5 52.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="52" y="51" width="36" height="6" rx="3" fill="#f97316"/>

  <!-- Item 2 -->
  <circle cx="43" cy="70" r="4" fill="#ea580c"/>
  <path d="M41 70 L42.5 71.5 L45.5 68.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="52" y="67" width="32" height="6" rx="3" fill="#ea580c"/>

  <!-- Item 3 -->
  <circle cx="43" cy="86" r="4" fill="#f43f5e"/>
  <path d="M41 86 L42.5 87.5 L45.5 84.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="52" y="83" width="24" height="6" rx="3" fill="#f43f5e"/>

  <!-- 5. Cheerful Sparkle Star at Top Right -->
  <g transform="translate(94, 10)" filter="url(#sparkleGlow)">
    <circle cx="12" cy="12" r="14" fill="#fef08a" opacity="0.4"/>
    <circle cx="12" cy="12" r="9" fill="#facc15" opacity="0.9"/>
    <!-- 4-pointed Star -->
    <path d="M12 2 C12 7.5 16.5 12 22 12 C16.5 12 12 16.5 12 22 C12 16.5 7.5 12 2 12 C7.5 12 12 7.5 12 2 Z" fill="#ffffff"/>
  </g>
</svg>